name: Remote action contracts

on:
  push:
  pull_request:
jobs:
  postgresql-action-publication:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: juzhen_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d juzhen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/juzhen_test
      TEST_POSTGRES_ALLOW_RESET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_central_actions_postgresql.py -q
